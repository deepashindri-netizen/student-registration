
<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Registration | RABKAVI BANAHATTI GK COMPETITION</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>

<body>
  <header class="top">
    <div class="brand">RABKAVI BANAHATTI GK COMPETITION</div>
    <p class="intro">ವಿದ್ಯಾರ್ಥಿಗಳ ನೋಂದಣಿ ಅರ್ಜಿ</p>
  </header>

  <main class="panel">
    <h1>ವಿದ್ಯಾರ್ಥಿ ನೋಂದಣಿ</h1>
    <p>ದಯವಿಟ್ಟು ನಿಮ್ಮ ವಿವರಗಳನ್ನು ಸರಿಯಾಗಿ ಭರ್ತಿ ಮಾಡಿ.</p>

    <form id="form">
      <label for="studentName">ವಿದ್ಯಾರ್ಥಿಯ ಪೂರ್ಣ ಹೆಸರು</label>
      <input
        type="text"
        id="studentName"
        name="studentName"
        placeholder="ವಿದ್ಯಾರ್ಥಿಯ ಹೆಸರು"
        required
      >

      <label for="fatherName">ತಂದೆಯ ಹೆಸರು</label>
      <input
        type="text"
        id="fatherName"
        name="fatherName"
        placeholder="ತಂದೆಯ ಹೆಸರು"
        required
      >

      <label for="dob">ಜನ್ಮ ದಿನಾಂಕ</label>
      <input
        type="date"
        id="dob"
        name="dob"
        required
      >

      <label for="mobile">ಮೊಬೈಲ್ ಸಂಖ್ಯೆ</label>
      <input
        type="tel"
        id="mobile"
        name="mobile"
        placeholder="10 ಅಂಕಿಯ ಮೊಬೈಲ್ ಸಂಖ್ಯೆ"
        pattern="[6-9][0-9]{9}"
        maxlength="10"
        inputmode="numeric"
        required
      >

      <label for="examinationMode">ಪರೀಕ್ಷೆಯ ವಿಧಾನ</label>
      <select
        id="examinationMode"
        name="examinationMode"
        required
      >
        <option value="">ಪರೀಕ್ಷೆಯ ವಿಧಾನ ಆಯ್ಕೆಮಾಡಿ</option>
        <option value="Online">Online (ಆನ್‌ಲೈನ್)</option>
        <option value="Offline">Offline (ಆಫ್‌ಲೈನ್)</option>
      </select>

      <div class="fee">
        <p>ನೋಂದಣಿ ಶುಲ್ಕ</p>
        <h2>₹250</h2>
      </div>

      <button type="submit" id="submit">
        ನೋಂದಣಿ ಮಾಡಿ ಪಾವತಿಸಿ
      </button>

      <p id="result" class="result hidden" role="status"></p>
    </form>

    <p class="hint">
      ಪಾವತಿ ಪೂರ್ಣಗೊಂಡ ನಂತರ ನಿಮ್ಮ ನೋಂದಣಿ ಸಂಖ್ಯೆಯನ್ನು ತೋರಿಸಲಾಗುತ್ತದೆ.
    </p>
  </main>

  <footer>
    <p>RABKAVI BANAHATTI GK COMPETITION</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
