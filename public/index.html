
<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7b1020">
  <meta name="description" content="RABKAVI BANAHATTI GK COMPETITION ವಿದ್ಯಾರ್ಥಿ ನೋಂದಣಿ">
  <title>RABKAVI BANAHATTI GK COMPETITION</title>

  <link rel="manifest" href="/manifest.json">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, "Noto Sans Kannada", sans-serif;
      background: #f0f5fb;
      color: #222;
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
    }

    .prize-banner {
      width: 100%;
      margin: 0 auto 20px;
      text-align: center;
    }

    .prize-banner img {
      display: block;
      width: 100%;
      height: auto;
      max-width: 1600px;
      margin: 0 auto;
      border-radius: 8px;
    }

    .card {
      background: #fff;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      color: #7b1020;
      font-size: 25px;
      line-height: 1.5;
      margin-top: 0;
    }

    .subtitle {
      text-align: center;
      color: #555;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 16px 0 8px;
    }

    input:not([type="radio"]) {
      width: 100%;
      padding: 13px;
      border: 1px solid #bbb;
      border-radius: 8px;
      font-size: 16px;
      background: white;
    }

    .mode-options {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .mode-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fafafa;
      cursor: pointer;
      margin: 0;
      font-weight: normal;
    }

    .mode-option input {
      width: 18px;
      height: 18px;
      accent-color: #7b1020;
    }

    .fee {
      margin-top: 20px;
      padding: 14px;
      background: #fff3d8;
      border-radius: 8px;
      font-size: 18px;
      text-align: center;
      font-weight: bold;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background: #7b1020;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    #message {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 8px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    #message.success {
      display: block;
      color: #155724;
      background: #d4edda;
    }

    #message.error {
      display: block;
      color: #721c24;
      background: #f8d7da;
    }

    .note {
      font-size: 13px;
      line-height: 1.6;
      color: #555;
      margin-top: 16px;
    }

    footer {
      text-align: center;
      margin: 18px 0 8px;
      color: #666;
      font-size: 13px;
    }

    @media (max-width: 480px) {
      body {
        padding: 8px;
      }

      .card {
        padding: 16px;
      }

      h1 {
        font-size: 21px;
      }

      .prize-banner img {
        border-radius: 5px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <!-- Prize banner -->
    <div class="prize-banner">
      <img
        src="/prize-banner.jpeg"
        alt="RABKAVI BANAHATTI GK COMPETITION ಬಹುಮಾನಗಳ ವಿವರ"
      >
    </div>

    <!-- Registration form -->
    <section class="card">
      <h1>RABKAVI BANAHATTI<br>GK COMPETITION</h1>

      <p class="subtitle">ವಿದ್ಯಾರ್ಥಿ ನೋಂದಣಿ ಫಾರ್ಮ್</p>

      <form id="registrationForm">
        <label for="studentName">ವಿದ್ಯಾರ್ಥಿಯ ಪೂರ್ಣ ಹೆಸರು *</label>
        <input
          id="studentName"
          name="studentName"
          type="text"
          maxlength="100"
          autocomplete="name"
          required
        >

        <label for="fatherName">ತಂದೆಯ ಹೆಸರು *</label>
        <input
          id="fatherName"
          name="fatherName"
          type="text"
          maxlength="100"
          required
        >

        <label for="dob">ಜನ್ಮ ದಿನಾಂಕ *</label>
        <input
          id="dob"
          name="dob"
          type="date"
          required
        >

        <label for="mobile">ಮೊಬೈಲ್ ಸಂಖ್ಯೆ *</label>
        <input
          id="mobile"
          name="mobile"
          type="tel"
          inputmode="numeric"
          pattern="[6-9][0-9]{9}"
          maxlength="10"
          placeholder="10 ಅಂಕಿಗಳ ಮೊಬೈಲ್ ಸಂಖ್ಯೆ"
          required
        >

        <label>ಪರೀಕ್ಷೆಯ ವಿಧಾನ ಆಯ್ಕೆಮಾಡಿ *</label>

        <div class="mode-options">
          <label class="mode-option">
            <input
              type="radio"
              name="examinationMode"
              value="Online"
              required
            >
            Online ಪರೀಕ್ಷೆ
          </label>

          <label class="mode-option">
            <input
              type="radio"
              name="examinationMode"
              value="Offline"
              required
            >
            Offline ಪರೀಕ್ಷೆ
          </label>
        </div>

        <div class="fee">
          ನೋಂದಣಿ ಶುಲ್ಕ: ₹250
        </div>

        <button id="submitButton" type="submit">
          ನೋಂದಣಿ ಮಾಡಿ ಮತ್ತು ಪಾವತಿಸಿ
        </button>

        <p class="note">
          * ಎಲ್ಲಾ ವಿವರಗಳನ್ನು ಸರಿಯಾಗಿ ತುಂಬಿಸಿ. ಪಾವತಿ ಯಶಸ್ವಿಯಾದ ನಂತರ
          ನೋಂದಣಿ ಸಂಖ್ಯೆ ನೀಡಲಾಗುತ್ತದೆ. ಪಾವತಿ ಸ್ಥಿತಿ ದೃಢಪಡಿಸುವವರೆಗೆ
          ಮತ್ತೆ ಪಾವತಿಸಲು ಪ್ರಯತ್ನಿಸಬೇಡಿ.
        </p>
      </form>

      <div id="message" role="status" aria-live="polite"></div>
    </section>

    <footer>
      RABKAVI BANAHATTI GK COMPETITION
    </footer>
  </main>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <script>
    const form = document.getElementById("registrationForm");
    const submitButton = document.getElementById("submitButton");
    const messageBox = document.getElementById("message");

    let paymentInProgress = false;

    function showMessage(message, type) {
      messageBox.className = type;
      messageBox.textContent = message;
    }

    function setLoading(isLoading) {
      submitButton.disabled = isLoading;
      submitButton.textContent = isLoading
        ? "ದಯವಿಟ್ಟು ಕಾಯಿರಿ..."
        : "ನೋಂದಣಿ ಮಾಡಿ ಮತ್ತು ಪಾವತಿಸಿ";
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      if (paymentInProgress) return;

      if (!form.reportValidity()) return;

      if (typeof Razorpay === "undefined") {
        showMessage(
          "ಪಾವತಿ ವ್ಯವಸ್ಥೆಯನ್ನು ಲೋಡ್ ಮಾಡಲು ಸಾಧ್ಯವಾಗಲಿಲ್ಲ. Internet ಸಂಪರ್ಕ ಪರಿಶೀಲಿಸಿ.",
          "error"
        );
        return;
      }

      const formData = new FormData(form);

      const student = {
        studentName: String(formData.get("studentName") || "").trim(),
        fatherName: String(formData.get("fatherName") || "").trim(),
        dob: String(formData.get("dob") || ""),
        mobile: String(formData.get("mobile") || "").trim(),
        examinationMode: String(formData.get("examinationMode") || "")
      };

      paymentInProgress = true;
      setLoading(true);
      showMessage("ನೋಂದಣಿ ವಿವರಗಳನ್ನು ಸಿದ್ಧಪಡಿಸಲಾಗುತ್ತಿದೆ...", "");

      try {
        const response = await fetch("/api/register", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(student)
        });

        const orderData = await response.json();

        if (!response.ok) {
          throw new Error(
            orderData.error || "ನೋಂದಣಿ ಸಿದ್ಧಪಡಿಸಲು ಸಾಧ್ಯವಾಗಲಿಲ್ಲ."
          );
        }

        if (
          !orderData.orderId ||
          !orderData.keyId ||
          !orderData.registrationId
        ) {
          throw new Error("ಪಾವತಿ ವಿವರಗಳು ಅಪೂರ್ಣವಾಗಿವೆ. ಸಹಾಯ ಪಡೆಯಿರಿ.");
        }

        const options = {
          key: orderData.keyId,
          amount: orderData.amount,
          currency: orderData.currency,
          name: orderData.merchantName ||
            "RABKAVI BANAHATTI GK COMPETITION",
          description: "Student Registration Fee",
          order_id: orderData.orderId,

          handler: async function (paymentResponse) {
            showMessage("ಪಾವತಿಯನ್ನು ಪರಿಶೀಲಿಸಲಾಗುತ್ತಿದೆ...", "");

            try {
              const verifyResponse = await fetch("/api/payments/verify", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  registrationId: orderData.registrationId,
                  razorpay_order_id: paymentResponse.razorpay_order_id,
                  razorpay_payment_id: paymentResponse.razorpay_payment_id,
                  razorpay_signature: paymentResponse.razorpay_signature
                })
              });

              const verifyData = await verifyResponse.json();

              if (!verifyResponse.ok || !verifyData.success) {
                throw new Error(
                  verifyData.error ||
                  "ಪಾವತಿ ದೃಢೀಕರಣ ಪೂರ್ಣಗೊಂಡಿಲ್ಲ. ಮತ್ತೆ ಪಾವತಿಸಬೇಡಿ; ಸಹಾಯ ಪಡೆಯಿರಿ."
                );
              }

              showMessage(
                "ನೋಂದಣಿ ಯಶಸ್ವಿಯಾಗಿದೆ!\n" +
                "ವಿದ್ಯಾರ್ಥಿ: " + student.studentName + "\n" +
                "ಪರೀಕ್ಷೆಯ ವಿಧಾನ: " + student.examinationMode + "\n" +
                "ನೋಂದಣಿ ಸಂಖ್ಯೆ: " + verifyData.registrationNumber,
                "success"
              );

              form.reset();
            } catch (error) {
              showMessage(
                error.message ||
                "ಪಾವತಿ நிலையை ಪರಿಶೀಲಿಸಲು ಸಾಧ್ಯವಾಗಲಿಲ್ಲ. மீண்டும் பணம் செலுத்த வேண்டாம்; உதவி பெறவும்.",
                "error"
              );
            } finally {
              paymentInProgress = false;
              setLoading(false);
            }
          },

          modal: {
            ondismiss: function () {
              paymentInProgress = false;
              setLoading(false);
              showMessage(
                "ಪಾವತಿ ವಿಂಡೋ ಮುಚ್ಚಲಾಗಿದೆ. ಪಾವತಿ ಸ್ಥಿತಿ ಖಚಿತಪಡಿಸಿಕೊಳ್ಳದೆ ಮತ್ತೆ ಪಾವತಿಸಬೇಡಿ.",
                "error"
              );
            }
          },

          theme: {
            color: "#7b1020"
          }
        };

        const checkout = new Razorpay(options);

        checkout.on("payment.failed", function () {
          paymentInProgress = false;
          setLoading(false);

          showMessage(
            "ಪಾವತಿ ಪೂರ್ಣಗೊಂಡಿಲ್ಲ ಅಥವಾ ವಿಫಲವಾಗಿದೆ. ಪಾವತಿ ಸ್ಥಿತಿಯನ್ನು ಪರಿಶೀಲಿಸಿ; ಅಗತ್ಯವಿದ್ದರೆ ಸಹಾಯ ಪಡೆಯಿರಿ.",
            "error"
          );
        });

        checkout.open();

      } catch (error) {
        paymentInProgress = false;
        setLoading(false);

        showMessage(
          error.message ||
          "ದೋಷ ಉಂಟಾಗಿದೆ. ದಯವಿಟ್ಟು ಸ್ವಲ್ಪ ಸಮಯದ ನಂತರ ಪ್ರಯತ್ನಿಸಿ.",
          "error"
        );
      }
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/service-worker.js")
          .catch(function (error) {
            console.error("Service worker registration failed:", error);
          });
      });
    }
  </script>
</body>
</html>
